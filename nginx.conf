server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /privacy y /privacy/ resuelven al index de esa carpeta; lo demás, 404 real.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Los WebP y el favicon no cambian entre despliegues salvo que se reemplacen.
    location ~* \.(webp|svg|png|jpg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 512;
}
